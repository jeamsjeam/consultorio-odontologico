<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="author" content="Muhamad Nauval Azhar">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<meta name="description" content="This is a login page template based on Bootstrap 5">
	<link rel="stylesheet" type="text/css" href="css/login.css">
	<link rel="stylesheet" type="text/css" href="css/toastify.css">
    <link rel="stylesheet" type="text/css" href="bootstrap-5/css/bootstrap.min.css">
	<title>Bootstrap 5 Login Page</title>
</head>

<body style="background-color: #a882d7;">
	<section class="h-100">
		<div class="container h-100">
			<div class="row justify-content-sm-center h-100">
				<div class="col-8 mt-4">
					<div class="image-container">
						<img src="imagenes/IMG-20240810-WA0005.png" alt="logo">
					</div>
					<div class="row mt-3">
						<div class="col-6">
							<div class="card shadow-lg">
								<div class="card-body py-2 px-5">
									<h1 class="fs-4 card-title fw-bold mb-4">Registrar</h1>
									<form action="#" method="POST" class="needs-validation" novalidate="" autocomplete="off" onsubmit="event.preventDefault(); crearUsuario()">
										<div class="mb-3">
											<label class="mb-2 text-muted" for="usuario">Usuario</label>
											<input id="usuario" type="text" class="form-control" name="usuario" value="" required autofocus>
											<div class="invalid-feedback">
												Usuario requerido	
											</div>
										</div>
		
										<div class="mb-3">
											<label class="mb-2 text-muted" for="clave">Contraseña</label>
											<input id="clave" type="password" class="form-control" name="clave" required>
											<div class="invalid-feedback">
												Contraseña requerida
											</div>
										</div>
		
										<div class="mb-3">
											<label class="mb-2 text-muted" for="repetirClave">Repetir Contraseña</label>
											<input id="repetirClave" type="password" class="form-control" name="repetirClave" required>
											<div class="invalid-feedback">
												Contraseña requerida
											</div>
										</div>
										
										<div class="align-items-center d-flex">
											<button type="submit" class="btn btn-primary ms-auto">
												Registrar	
											</button>
										</div>
									</form>
								</div>
								<div class="card-footer py-3 border-0">
									<div class="text-center">
										Ya tiene cuenta? <a href="login.html" class="text-dark">Login</a>
									</div>
								</div>
							</div>							
						</div>
						<div class="col-6">
							<div class="card shadow-lg" style="min-width: 414px;">
								<div class="card-body" >
									<div id="carouselExampleControls" class="carousel slide" data-bs-ride="carousel">
										<div class="carousel-inner">
											<div class="carousel-item active">
												<img src="imagenes/IMG-20240806-WA0077.jpg" class="d-block w-100" alt="...">
											</div>
										  	<div class="carousel-item">
												<img src="imagenes/IMG-20241028-WA0015.jpg" class="d-block w-100" alt="...">
										  	</div>
											<div class="carousel-item">
												<img src="imagenes/navidad.png" class="d-block w-100" alt="...">
										  	</div>
											  <div class="carousel-item">
												<img src="imagenes/atencion.jpg" class="d-block w-100" alt="...">
										  	</div>
											  <div class="carousel-item">
												<img src="imagenes/clinica sala.png" class="d-block w-100" alt="...">
										  	</div>
										</div>
										<button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleControls" data-bs-slide="prev">
										  <span class="carousel-control-prev-icon" aria-hidden="true"></span>
										  <span class="visually-hidden">Previous</span>
										</button>
										<button class="carousel-control-next" type="button" data-bs-target="#carouselExampleControls" data-bs-slide="next">
										  <span class="carousel-control-next-icon" aria-hidden="true"></span>
										  <span class="visually-hidden">Next</span>
										</button>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>

	<script src="js/toastify.js"></script>
	<script src="js/utilidades.js"></script>
	<script src="js/login.js"></script>
	<script src="bootstrap-5/js/bootstrap.min.js"></script>
</body>
</html>
