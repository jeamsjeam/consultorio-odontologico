<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="css/utilidades.css">
    <link rel="stylesheet" type="text/css" href="css/toastify.css">
    <link rel="stylesheet" type="text/css" href="bootstrap-5/css/bootstrap.min.css">
    <title>Inicio</title>
</head>
<body style="background-color: #eaeaea;">
    <div class="main"> 
        <nav id="navbar" class="navbar navbar-expand-lg navbar-light bg-light px-3 mb-4" style="background-color: #e7d5ed; border-bottom: solid 2px #ba87ca">
        </nav>
        
        <div class="container">
            <div class="row">
                <div class="col-4 p-5">
                    <div class="card shadow-lg mt-2">
                        <div class="card-header text-center" style="background-color: #ad96e8; color: white;">
                            <h4 class="fw-bold mb-0">Pedir cita</h4>
                        </div>
                        <div class="card-body">
                            <form action="#" method="POST" onsubmit="event.preventDefault(); crearCita()">
                                <div class="mb-3">
                                    <label class="mb-2 text-muted" for="fecha">Fecha de la cita</label>
                                    <input id="fecha" type="date" class="form-control" name="fecha" required>
                                </div>
        
                                <div class="mb-4">
                                    <label class="mb-2 text-muted" for="servicio">Servicios</label>
                                    <select name="servicio" class="form-select" aria-label="Default select example" id="servicios-select">
                                        <!-- Agrega opciones del select si es necesario -->
                                    </select>
                                </div>
        
                                <div class="d-flex align-items-center">
                                    <button type="submit" class="btn btn-primary ms-auto">
                                        Solicitar
                                    </button>
                                </div>
                            </form>
                        </div>
                        <div class="card-footer text-center" style="background-color: #e7d5ed;">
                            <small class="text-muted">Seleccione la fecha y el servicio.</small>
                        </div>
                    </div>
                </div>
                <div class="col-8 p-5">
            
                </div>
            </div>
        </div>
    
        <footer id="footer" class="d-flex flex-wrap justify-content-between align-items-center py-3 mt-4 border-top px-3" style="background-color: #ad96e8;">
        </footer>
    </div>
    
    <script src="js/cita.js"></script>
    <script src="js/toastify.js"></script>
    <script src="js/utilidades.js"></script>
    <script src="bootstrap-5/js/bootstrap.min.js"></script>
</body>
</html>
