<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="css/citas.css">
    <link rel="stylesheet" type="text/css" href="css/utilidades.css">
    <link rel="stylesheet" type="text/css" href="css/toastify.css">
    <link rel="stylesheet" type="text/css" href="css/DataTable/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" type="text/css" href="css/DataTable/cdnjs.cloudflare.com_ajax_libs_font-awesome_6.2.0_css_all.min.css">
    <link rel="stylesheet" type="text/css" href="bootstrap-5/css/bootstrap.min.css">
    <title>Clinica Odontológica Sonrisa</title>
</head>
<body style="background-color: #eaeaea;">
    <div class="main"> 
        <nav id="navbar" class="navbar navbar-expand-lg navbar-light bg-light px-3 mb-4" style="background-color: #e7d5ed; border-bottom: solid 2px #ba87ca">
        </nav>
        
        <div class="container">
            <div class="row">
                <div class="col-4 p-5 mt-4">
                    <div class="card shadow-lg mt-2">
                        <div class="card-header text-center" style="background-color: #ad96e8; color: white;">
                            <h4 class="fw-bold mb-0">Pedir cita</h4>
                        </div>
                        <div class="card-body">
                            <form action="#" method="POST" onsubmit="event.preventDefault(); crearCita()">
                                <div class="mb-3">
                                    <label class="mb-2 text-muted" for="fecha">Fecha de la cita</label>
                                    <input id="fecha" type="date" class="form-control" name="fecha" required>
                                </div>
        
                                <div class="mb-4">
                                    <label class="mb-2 text-muted" for="servicio">Servicios</label>
                                    <select name="servicio" class="form-select" aria-label="Default select example" id="servicios-select">
                                        <!-- Agrega opciones del select si es necesario -->
                                    </select>
                                </div>
        
                                <div class="d-flex align-items-center">
                                    <button type="submit" class="btn btn-primary ms-auto">
                                        Solicitar
                                    </button>
                                </div>
                            </form>
                        </div>
                        <div class="card-footer text-center" style="background-color: #e7d5ed;">
                            <small class="text-muted">Seleccione la fecha y el servicio.</small>
                        </div>
                    </div>
                </div>
                <div class="col-8 px-5">
                    <div class="row justify-content-center">
                        <div class="col-md-4 mb-1">
                            <select id="month" class="form-select form-control"></select>
                        </div>
                        <div class="col-md-4 mb-1">
                            <select id="year" class="form-select form-control"></select>
                        </div>
                        <div class="col-md-2 mb-1 d-flex align-items-end">
                            <button onclick="renderCalendar()" class="btn btn-primary">Mostrar</button>
                        </div>
                    </div>
                    
                    <div class="calendar border rounded p-3 shadow-lg" id="calendar"></div>
                </div>
            </div>
            <div class="row">
                <div class="col-12 my-5">
                  <table id="datatable_citas" class="table table-striped">
                    <caption>
                        Citas
                    </caption>
                    <thead>
                        <tr>
                            <th class="centered">#</th>
                            <th class="centered">Cedula</th>
                            <th class="centered">Nombre</th>
                            <th class="centered">Apellido</th>
                            <th class="centered">Fecha Nacimiento</th>
                            <th class="centered">Telefono</th>
                            <th class="centered">Fecha</th>
                            <th class="centered">Serivicio</th>
                            <th class="centered">Estado</th>
                            <!-- <th class="centered">Opciones</th> -->
                        </tr>
                    </thead>
                    <tbody id="tableBody_citas"></tbody>
                  </table> 
                </div>
            </div>
        </div>
    
        <footer id="footer" class="d-flex flex-wrap justify-content-between align-items-center py-3 mt-4 border-top px-3" style="background-color: #ad96e8;">
        </footer>
    </div>
    
    <script src="js/DataTable/cdnjs.cloudflare.com_ajax_libs_jquery_3.6.0_jquery.min.js"></script>
    <script src="js/DataTable/cdn.datatables.net_1.12.1_js_jquery.dataTables.min.js"></script>
    <script src="js/DataTable/cdn.datatables.net_1.12.1_js_dataTables.bootstrap5.min.js"></script>
    <script src="js/cita.js"></script>
    <script src="js/toastify.js"></script>
    <script src="js/utilidades.js"></script>
    <script src="bootstrap-5/js/bootstrap.min.js"></script>
</body>
</html>
